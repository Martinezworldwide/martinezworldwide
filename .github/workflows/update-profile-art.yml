name: Update profile art

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"
      - "data/**"
      - "assets/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"
      - name: Render art
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py --username "${{ github.repository_owner }}" --height 330 --width 300 --os "macOS + Linux" --stack "Python / JS / SVG / CI" --ships "tools + automation" --socials "GitHub / LinkedIn / X"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-heatmap.svg assets/info-card.svg
          git diff --cached --quiet || git commit -m "Update profile art [skip ci]"
          git pull --rebase origin main
          git push
